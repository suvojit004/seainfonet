services:
  app:
    build: .
    
    expose:
      - "3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production  
      - MONGO_URI=mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongodb:27017/mydb

    env_file:
      - .env
    depends_on:
      - mongodb
    networks:
      - app-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  
  mongodb:
    image: mongo:8.2.7

    restart: unless-stopped 

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: mydb
    
    env_file:
      - .env
    
    volumes:
      - mongo-data:/data/db
      - ./init.js:/docker-entrypoint-initdb.d/init.js

    networks:
      - app-network
      - traefik-proxy

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  nginx:
    image: nginx:stable-alpine
    restart: always
    expose:
      - "80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./Public:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - app-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - traefik.enable=true
      - traefik.http.routers.myapp.rule=PathPrefix(`/`)
      - traefik.http.routers.myapp.entrypoints=web
      - traefik.http.services.myapp.loadbalancer.server.port=80

networks:
  app-network:
  traefik-proxy:
    external: true

volumes:
  mongo-data: